services:
  - type: web
    name: ubagen-github-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn redirect_bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GITHUB_REPOSITORY
        value: ubaparator/UBAgenGitv0.01
      - key: DASHBOARD_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
