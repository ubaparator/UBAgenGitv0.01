name: Validate code

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Best effort: GitHub scheduled workflows can be delayed; exact 14m30s is not guaranteed.
    - cron: "*/14 * * * *"

permissions:
  contents: read

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          set -u
          url="https://ubagen-github-bridge.onrender.com/health"
          echo "Pinging Render health endpoint: $url"
          status="$(curl --silent --show-error --max-time 25 --output health.json --write-out '%{http_code}' "$url")" || {
            echo "Health request failed at transport level."
            exit 1
          }
          cat health.json
          echo
          echo "HTTP status: $status"
          if [ "$status" -ge 500 ]; then
            echo "Render endpoint returned an unhealthy/server error status."
            exit 1
          fi

  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyyaml
      - run: python -m py_compile redirect_bot.py
      - run: python -m unittest discover -s tests -v
      - name: Import application
        run: python -c "import redirect_bot; print('Application import OK')"
