name: Render health check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$HEALTH_URL" ]]; then
            echo "RENDER_HEALTH_URL secret is not configured; skipping."
            exit 0
          fi
          code="$(curl --silent --show-error --location --output /tmp/health.json --write-out '%{http_code}' --max-time 25 "$HEALTH_URL")"
          cat /tmp/health.json
          [[ "$code" == "200" ]] || { echo "Health check failed: HTTP $code"; exit 1; }
